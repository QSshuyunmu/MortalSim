name: MortalSim CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install application dependencies
        run: python -m pip install -r requirements-app.txt pytest
      - name: Python tests
        run: python -m pytest tests mortal_app/test_gpu_monitor.py -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # The upstream crate carries an intentionally broad deny-list that
      # changes across Rust releases. Run Clippy as an advisory gate while
      # rustfmt and tests remain blocking.
      - run: cargo clippy -p libriichi --lib -- --cap-lints warn
      - run: cargo test -p libriichi --lib
