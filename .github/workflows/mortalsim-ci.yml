name: MortalSim CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install application dependencies
        run: python -m pip install -r requirements-app.txt -r requirements-test.txt
      - name: Python tests
        run: python -m pytest tests mortal_app/test_gpu_monitor.py -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # The upstream crate carries an intentionally broad deny-list that
      # changes across Rust releases. Run Clippy as an advisory gate while
      # rustfmt and tests remain blocking.
      - run: cargo clippy -p libriichi --lib -- --cap-lints warn
      # PyO3's extension-module feature intentionally omits libpython linkage
      # on Unix. Disable it for the Rust test executable.
      - run: cargo test -p libriichi --lib --no-default-features --features mimalloc
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
      - name: Check local documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md README.zh-CN.md docs/**/*.md
          fail: true
