name: MortalSim Windows Package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CUDA dependencies
        run: python -m pip install -r requirements-cuda.txt pyinstaller
      - name: Build package
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Variant CUDA -AllowMissingModel
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MortalSim-Windows-x64-CUDA
          path: release/*.zip
