name: MortalSim Windows Package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CUDA dependencies
        run: python -m pip install -r requirements-lock.txt pyinstaller
      - name: Build package
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Variant CUDA
      - name: Verify split release assets
        shell: pwsh
        run: ./packaging/verify_release.ps1
      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: MortalSim-Windows-x64-CUDA-model-free
          path: |
            release/*.zip
            release/SHA256SUMS.txt
