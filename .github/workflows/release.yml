name: Release MortalSim CUDA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: true
        default: main
        type: string
      tag:
        description: Semantic prerelease tag to create, for example v0.2.0-alpha.0
        required: true
        type: string
      publish:
        description: Create a prerelease from this validated build
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-test.txt pyinstaller
      - name: Verify source tests
        shell: pwsh
        run: |
          python -m pytest tests mortal_app/test_gpu_monitor.py -q
          cargo test -p libriichi --lib
          npm --prefix apps/web ci
          npm --prefix apps/web run typecheck
      - name: Build checkpoint-free split CUDA archives
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Variant CUDA
      - name: Verify release assets
        shell: pwsh
        run: ./packaging/verify_release.ps1
      - name: Upload verified release candidate
        uses: actions/upload-artifact@v6
        with:
          name: MortalSim-Windows-x64-CUDA-checkpoint-free
          path: |
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish GitHub prerelease
        if: inputs.publish
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+') { throw 'Use a semantic version tag/ref when publishing.' }
          gh release create $env:TAG release/*.zip release/SHA256SUMS.txt --prerelease --title "MortalSim $env:TAG" --notes-file docs/RELEASE_NOTES_v0.2.0-alpha.0.md
