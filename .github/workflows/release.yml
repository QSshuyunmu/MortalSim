name: Release MortalSim CUDA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: true
        default: main
        type: string
      tag:
        description: Semantic prerelease tag to create, for example v0.3.0-rc.1
        required: true
        type: string
      publish:
        description: Create a prerelease from this validated build
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    runs-on: [self-hosted, Windows, X64, mortalsim-build, sm89]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Lite build dependencies
        run: python -m pip install -r requirements-app.txt -r requirements-test.txt pyinstaller
      - name: Verify source tests
        shell: pwsh
        run: |
          python -m pytest tests mortal_app/test_gpu_monitor.py -q
          cargo test -p libriichi --lib
          npm --prefix apps/web ci
          npm --prefix apps/web run typecheck
      - name: Check native Lite runtime inputs
        shell: pwsh
        run: |
          if (-not $env:MORTALSIM_LITE_ARTIFACT_DIR) {
            throw 'Configure MORTALSIM_LITE_ARTIFACT_DIR on the fixed release builder.'
          }
          $required = @('mortal_lite_runtime.dll','aoti_cuda_shims.dll','cudart64_12.dll','model.dll','runtime_manifest.json')
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $env:MORTALSIM_LITE_ARTIFACT_DIR $name))) {
              throw "Missing Formal Lite artifact: $name"
            }
          }
      - name: Build checkpoint-free Lite archive
        shell: pwsh
        run: ./packaging/build_lite_windows.ps1 -ArtifactDir $env:MORTALSIM_LITE_ARTIFACT_DIR
      - name: Verify release assets
        shell: pwsh
        run: ./packaging/verify_release.ps1
      - name: Upload verified Lite release candidate
        uses: actions/upload-artifact@v6
        with:
          name: MortalSim-Windows-x64-Lite-checkpoint-free
          path: |
            release/MortalSim-Windows-x64-Lite-*.zip
            release/SHA256SUMS-Lite.txt
            release/SBOM.cdx.json
            release/LITE_VALIDATION-*.json
      - name: Publish GitHub prerelease
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+') { throw 'Use a semantic version tag/ref when publishing.' }
          gh release create $env:TAG release/MortalSim-Windows-x64-Lite-*.zip release/SHA256SUMS-Lite.txt release/SBOM.cdx.json release/LITE_VALIDATION-*.json --prerelease --title "MortalSim $env:TAG" --notes-file docs/RELEASE_NOTES_v0.3.0-rc.1.md
