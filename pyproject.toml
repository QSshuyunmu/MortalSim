[project]
name = "mortalsim"
version = "0.3.0rc1"
description = "Local web desktop application for Mortal first-discard simulation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.137.1",
  "uvicorn==0.46.0",
  "pydantic==2.13.3",
  "openpyxl==3.1.5",
  "lightgbm==4.7.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "mortal_app"]
